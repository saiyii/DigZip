name: Release

# Builds standalone digzip binaries and attaches them to the GitHub release of a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0 (or any branch, for a dry run)
        required: true
      publish:
        description: Attach the archives to the release of the tag
        type: boolean
        default: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name || matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            triplet: x64-windows-dist
            triplet_body: |
              set(VCPKG_TARGET_ARCHITECTURE x64)
              set(VCPKG_CRT_LINKAGE static)
              set(VCPKG_LIBRARY_LINKAGE static)
              set(VCPKG_BUILD_TYPE release)
            cmake_args: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
            parts: cli
          # Qt needs the shared C++ runtime, unlike the standalone command-line tool.
          - target: windows-x64
            name: windows-x64-gui
            os: windows-latest
            triplet: x64-windows-gui
            triplet_body: |
              set(VCPKG_TARGET_ARCHITECTURE x64)
              set(VCPKG_CRT_LINKAGE dynamic)
              set(VCPKG_LIBRARY_LINKAGE static)
              set(VCPKG_BUILD_TYPE release)
            cmake_args: -DDIGZIP_BUILD_GUI=ON
            qt_arch: win64_msvc2022_64
            parts: gui
          # The oldest available runner, so that the binary runs on older glibc versions.
          - target: linux-x64
            os: ubuntu-22.04
            triplet: x64-linux-dist
            triplet_body: |
              set(VCPKG_TARGET_ARCHITECTURE x64)
              set(VCPKG_CRT_LINKAGE dynamic)
              set(VCPKG_LIBRARY_LINKAGE static)
              set(VCPKG_CMAKE_SYSTEM_NAME Linux)
              set(VCPKG_BUILD_TYPE release)
            cmake_args: -DVCPKG_MANIFEST_FEATURES=openssl "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
            parts: cli
          - target: macos-universal
            os: macos-latest
            triplet: universal-osx-dist
            triplet_body: |
              set(VCPKG_TARGET_ARCHITECTURE arm64)
              set(VCPKG_CRT_LINKAGE dynamic)
              set(VCPKG_LIBRARY_LINKAGE static)
              set(VCPKG_CMAKE_SYSTEM_NAME Darwin)
              set(VCPKG_OSX_ARCHITECTURES "arm64;x86_64")
              set(VCPKG_OSX_DEPLOYMENT_TARGET 12.0)
              set(VCPKG_BUILD_TYPE release)
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DDIGZIP_BUILD_GUI=ON'
            qt_arch: clang_64
            parts: cli gui
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
      VCPKG_DISABLE_METRICS: 1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Fetch vcpkg at the manifest baseline
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: ${{ env.VCPKG_ROOT }}/bootstrap-vcpkg.bat -disableMetrics

      - name: Bootstrap vcpkg (Unix)
        if: runner.os != 'Windows'
        run: $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics

      - name: Write the static triplet
        shell: bash
        env:
          TRIPLET_BODY: ${{ matrix.triplet_body }}
        run: |
          dir="$RUNNER_TEMP/triplets"
          [ "$RUNNER_OS" = Windows ] && dir=$(cygpath -m "$dir")
          mkdir -p "$dir"
          printf '%s\n' "$TRIPLET_BODY" > "$dir/${{ matrix.triplet }}.cmake"
          echo "TRIPLETS_DIR=$dir" >> "$GITHUB_ENV"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-dist-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-dist-${{ matrix.triplet }}-

      - name: Install Qt
        if: matrix.qt_arch
        shell: bash
        run: |
          host=windows
          [ "$RUNNER_OS" = macOS ] && host=mac
          dir="$RUNNER_TEMP/Qt"
          [ "$RUNNER_OS" = Windows ] && dir=$(cygpath -m "$dir")
          pipx run --spec aqtinstall==3.3.0 aqt install-qt $host desktop 6.10.3 ${{ matrix.qt_arch }} --outputdir "$dir"
          qt=$(ls -d "$dir"/6.10.3/*)
          echo "CMAKE_PREFIX_PATH=$qt" >> "$GITHUB_ENV"
          echo "$qt/bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: >
          cmake --preset release
          "-DVCPKG_OVERLAY_TRIPLETS=$TRIPLETS_DIR"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release

      - name: Package
        shell: bash
        run: |
          binary=$(find build/release/bin -name 'digzip' -o -name 'digzip.exe' | head -n 1)
          "$binary" --version
          case "$RUNNER_OS" in
            Linux) ldd "$binary" ;;
            macOS) otool -L "$binary"; lipo -info "$binary" ;;
          esac
          packaging/package.sh "${TAG#v}" ${{ matrix.target }} build/release ${{ matrix.triplet }} ${{ matrix.parts }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name || matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "DigZip ${TAG#v}" --notes-file "../docs/releases/${TAG#v}.md"
          fi
          gh release upload "$TAG" * --repo "$GITHUB_REPOSITORY" --clobber
